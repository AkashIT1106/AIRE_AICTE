services:
  postgres:
    image: postgres:16-alpine
    container_name: aire-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-aire_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aire_secure_dev_password}
      POSTGRES_DB: ${DB_NAME:-aire_db}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-aire_user} -d ${DB_NAME:-aire_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aire-network

  redis:
    image: redis:7-alpine
    container_name: aire-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aire-network

  minio:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: aire-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aire_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-aire_minio_secret_key}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - aire-network

  server:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.server
    container_name: aire-server
    restart: unless-stopped
    environment:
      NODE_ENV: development
      APP_PORT: 4000
      DATABASE_URL: postgresql://${DB_USER:-aire_user}:${DB_PASSWORD:-aire_secure_dev_password}@postgres:5432/${DB_NAME:-aire_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_LEVEL: debug
      CORS_ORIGIN: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:-development_jwt_secret_change_in_production_min_32_chars}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aire-network

  workers:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    container_name: aire-workers
    restart: unless-stopped
    environment:
      NODE_ENV: development
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_LEVEL: debug
      DATABASE_URL: postgresql://${DB_USER:-aire_user}:${DB_PASSWORD:-aire_secure_dev_password}@postgres:5432/${DB_NAME:-aire_db}?schema=public
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - aire-network

  client:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.client
    container_name: aire-client
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - server
    networks:
      - aire-network

networks:
  aire-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
